[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[mgr]
append_keymap = [
  # Custom shortcut: go to projects with gp
  { on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go ~/Documents" },
  { on = [ "m", "t" ], run = "linemode size_and_mtime", desc = "Linemode: size and mtime" }, 
]

[[mgr.prepend_keymap]]
on   = [ ".", "s" ]
run  = "plugin what-size -- '--clipboard'"
desc = "Calc size of sel/cwd + paste to clipboard"
